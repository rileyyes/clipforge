name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install FFmpeg (Ubuntu)
        if: runner.os == 'Linux'
        timeout-minutes: 20  # each apt try is time-limited; falls back to a static build
        run: bash scripts/ci/install_ffmpeg.sh
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements.txt pytest-timeout
      - name: Run tests
        shell: bash
        working-directory: backend
        run: |
          ffmpeg -version | head -1
          set +e
          python -m pytest -p no:randomly -q -rf --timeout=600 --durations=15 2>&1 | tee pytest.log
          code=${PIPESTATUS[0]}
          # failures as annotations so they're visible without opening the log
          grep -E "^FAILED |Timeout" pytest.log | head -40 | sed 's/^/::error title=pytest (${{ matrix.os }})::/'
          # slowest tests, to spot platform-specific slowness
          echo "::notice title=slowest tests (${{ matrix.os }})::$(grep -E '^[0-9.]+s (call|setup)' pytest.log | head -15 | tr '\n' '|')"
          exit $code

  frontend:
    name: Frontend tests, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Unit + fuzz tests
        working-directory: frontend
        run: npm test
      - name: Typecheck (engine, strict)
        working-directory: frontend
        run: npm run typecheck
      - name: Typecheck (whole UI, with React types)
        working-directory: frontend
        shell: bash
        run: |
          set +e
          npx tsc -p tsconfig.ui.json --pretty false 2>&1 | tee tsc-ui.log
          code=${PIPESTATUS[0]}
          grep -E "error TS" tsc-ui.log | head -40 | sed 's/^/::error title=tsc::/'
          exit $code
      - name: Build
        working-directory: frontend
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: fuzz-timelines
          path: frontend/.test-build/fuzz_timelines.json
          retention-days: 3

  crosscheck-and-e2e:
    name: Cross-check + browser E2E
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install FFmpeg
        timeout-minutes: 20  # each apt try is time-limited; falls back to a static build
        run: bash scripts/ci/install_ffmpeg.sh
      - name: Install Python dependencies + Chromium
        run: |
          python -m pip install -r backend/requirements.txt
          python -m playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - uses: actions/download-artifact@v4
        with:
          name: fuzz-timelines
          path: frontend/.test-build
      - name: Engine → backend cross-check
        run: python scripts/crosscheck.py
      - name: Browser E2E
        shell: bash
        run: |
          fail=0
          for t in e2e_browser e2e_autoedit e2e_effects e2e_audio e2e_history e2e_phase6 e2e_library e2e_shorts e2e_publish e2e_facecam e2e_phase10 e2e_phase11 e2e_phase12 e2e_phase13 e2e_phase14 e2e_thumbnails; do
            echo "::group::$t"
            if ! python scripts/$t.py; then echo "::error title=$t::browser E2E failed"; fail=1; fi
            echo "::endgroup::"
          done
          exit $fail
      - name: Keep E2E screenshots if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: /tmp/rjclip-e2e-*/*.png
          retention-days: 5

  security:
    name: Dependency scans
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python (pip-audit)
        shell: bash
        run: |
          python -m pip install pip-audit
          set +e
          pip-audit -r backend/requirements.txt -r backend/requirements-ai.txt --progress-spinner off 2>&1 | tee audit-py.log
          code=${PIPESTATUS[0]}
          grep -E "^[A-Za-z0-9_.-]+ +[0-9]" audit-py.log | head -30 | sed 's/^/::error title=pip-audit::/'
          exit $code
      - name: JavaScript (npm audit)
        if: always()
        working-directory: frontend
        shell: bash
        run: |
          npm install --no-fund --package-lock-only
          set +e
          npm audit --audit-level=moderate 2>&1 | tee ../audit-js.log
          code=${PIPESTATUS[0]}
          grep -iE "^# npm audit report|severity|^[a-z@]" ../audit-js.log | head -30 | sed 's/^/::warning title=npm audit::/'
          exit $code

  windows-launcher:
    name: Windows launcher (first run from scratch)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Start RJClip with the launcher, like a double-click would
        shell: powershell  # Windows PowerShell 5.1, as on a normal PC (not pwsh 7)
        run: |
          # exactly what "Start RJClip.bat" runs
          $p = Start-Process cmd.exe -PassThru -RedirectStandardOutput out.txt -RedirectStandardError err.txt -ArgumentList '/c "Start RJClip.bat" -NoBrowser'
          $ok = $false
          for ($i = 0; $i -lt 300; $i++) {
            if ($p.HasExited) { break }  # launcher stopped (error): don't wait for nothing
            try { if ((Invoke-WebRequest -UseBasicParsing -TimeoutSec 2 http://127.0.0.1:8765/api/health).StatusCode -eq 200) { $ok = $true; break } } catch { }
            Start-Sleep -Seconds 2
          }
          $log = (Get-Content out.txt, err.txt -ErrorAction SilentlyContinue) -join "`n"
          Write-Output $log
          # the launcher's own output as one annotation (readable without opening the log)
          $tail = (($log -split "`n") | Select-Object -Last 60) -join "%0A"
          Write-Output "::warning title=launcher output::$tail"
          if (-not $ok) { Write-Output "::error title=launcher::RJClip didn't start from the launcher"; exit 1 }
          $page = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8765/
          if ($page.Content -notmatch "<div id=`"root`"") { Write-Output "::error title=launcher::UI not served"; exit 1 }
          # running it again must just detect the running app and exit cleanly
          cmd.exe /c "Start RJClip.bat" -NoBrowser
          if ($LASTEXITCODE -ne 0) { Write-Output "::error title=launcher::second start failed"; exit 1 }
          Stop-Process -Id $p.Id -Force
          Get-Process python -ErrorAction SilentlyContinue | Stop-Process -Force

  windows-portable:
    name: Windows portable package (build + run with nothing installed)
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the portable package
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          cmd /c "powershell -NoProfile -ExecutionPolicy Bypass -File scripts\windows\build_portable.ps1 > build.txt 2>&1"
          $code = $LASTEXITCODE
          Get-Content build.txt
          $tail = ((Get-Content build.txt) | Select-Object -Last 40) -join "%0A"
          if ($code -ne 0) { Write-Output "::error title=portable build::$tail"; exit 1 }
          Write-Output "::notice title=portable build::$tail"
      - name: Run it from a fresh folder with no Python, Node or FFmpeg on PATH
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          $dest = Join-Path $env:RUNNER_TEMP "pp"
          Expand-Archive portable\RJClip-portable-win64.zip $dest
          $hostPy = (Get-Command python).Source
          $env:RJCLIP_WORKSPACE = Join-Path $env:RUNNER_TEMP "ws"
          # only Windows itself on PATH: proves nothing installed on the runner is used
          $clean = "C:\Windows\System32;C:\Windows;C:\Windows\System32\WindowsPowerShell\v1.0"
          $p = Start-Process cmd.exe -PassThru -WorkingDirectory "$dest\RJClip" -RedirectStandardOutput out.txt -RedirectStandardError err.txt `
                 -ArgumentList '/c', "set PATH=$clean&& RJClip.bat -NoBrowser"
          $ok = $false
          for ($i = 0; $i -lt 120; $i++) {
            if ($p.HasExited) { break }
            try { if ((Invoke-WebRequest -UseBasicParsing -TimeoutSec 2 http://127.0.0.1:8765/api/health).StatusCode -eq 200) { $ok = $true; break } } catch { }
            Start-Sleep -Seconds 2
          }
          $log = (Get-Content out.txt, err.txt -ErrorAction SilentlyContinue) -join "`n"
          Write-Output $log
          if (-not $ok) {
            $tail = (($log -split "`n") | Select-Object -Last 40) -join "%0A"
            Write-Output "::error title=portable::didn't start%0A$tail"; exit 1
          }
          & $hostPy scripts\smoke_export.py --base http://127.0.0.1:8765 --ffmpeg "$dest\RJClip\ffmpeg\ffmpeg.exe" 2>&1 | Tee-Object smoke.txt
          $code = $LASTEXITCODE
          $s = ((Get-Content smoke.txt) | Select-Object -Last 30) -join "%0A"
          if ($code -ne 0) { Write-Output "::error title=portable smoke test::$s"; exit 1 }
          Write-Output "::notice title=portable smoke test::$s"
          $zipMb = [math]::Round((Get-Item portable\RJClip-portable-win64.zip).Length / 1MB, 1)
          Write-Output "::notice title=portable size::$zipMb MB zipped"
          Stop-Process -Id $p.Id -Force
          Get-Process python -ErrorAction SilentlyContinue | Stop-Process -Force
      - uses: actions/upload-artifact@v4
        with:
          name: RJClip-portable-win64
          path: portable/RJClip-portable-win64.zip
          retention-days: 14
